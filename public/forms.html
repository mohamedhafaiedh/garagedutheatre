<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Netlify Forms Skeleton</title>
</head>
<body>
  <!-- Formulaire de Devis Rapide et Demande de Devis (Accueil et Page Devis) -->
  <form name="devis" method="POST" data-netlify="true" hidden>
    <input type="hidden" name="form-name" value="devis" />
    <input type="hidden" name="subject" value="" />
    <input type="text" name="nom" value="" />
    <input type="email" name="email" value="" />
    <input type="tel" name="telephone" value="" />
    <input type="text" name="modele_vehicule" value="" />
    <input type="text" name="annee_vehicule" value="" />
    <input type="text" name="immatriculation" value="" />
    <textarea name="message"></textarea>
    <input type="hidden" name="pageUrl" value="" />
    <input type="hidden" name="timestamp" value="" />
    <input type="hidden" name="source" value="" />
  </form>

  <!-- Formulaire de Contact -->
  <form name="contact" method="POST" data-netlify="true" hidden>
    <input type="hidden" name="form-name" value="contact" />
    <input type="hidden" name="subject" value="" />
    <input type="text" name="nom" value="" />
    <input type="text" name="prenom" value="" />
    <input type="email" name="email" value="" />
    <input type="tel" name="telephone" value="" />
    <textarea name="message"></textarea>
    <input type="hidden" name="pageUrl" value="" />
    <input type="hidden" name="timestamp" value="" />
    <input type="hidden" name="source" value="" />
  </form>
</body>
</html>
