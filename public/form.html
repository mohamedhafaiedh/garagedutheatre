<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Netlify Forms Skeleton</title>
</head>
<body>
  <!-- Formulaire de Devis Rapide et Demande de Devis -->
  <form name="devis" method="POST" data-netlify="true" hidden>
    <input type="hidden" name="form-name" value="devis" />
    <input type="text" name="your-name" />
    <input type="email" name="your-email" />
    <input type="tel" name="your-phone" />
    <input type="text" name="your-carmodel" />
    <input type="text" name="your-caryear" />
    <input type="text" name="your-carimmat" />
    <textarea name="your-message"></textarea>
    <input type="hidden" name="pageUrl" />
    <input type="hidden" name="timestamp" />
    <input type="hidden" name="source" />
  </form>

  <!-- Formulaire de Contact -->
  <form name="contact" method="POST" data-netlify="true" hidden>
    <input type="hidden" name="form-name" value="contact" />
    <input type="text" name="your-website" />
    <input type="text" name="your-name" />
    <input type="email" name="your-email" />
    <input type="tel" name="your-phone" />
    <textarea name="your-message"></textarea>
    <input type="hidden" name="pageUrl" />
    <input type="hidden" name="timestamp" />
    <input type="hidden" name="source" />
  </form>
</body>
</html>
